<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>AWS Certified AI Practitioner – Practice Exams</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/styles.css" />
  </head>

  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark px-3">
      <span class="navbar-brand mb-0 h5">
        ☁️ AWS Certified AI Practitioner – Practice Exams
      </span>
      <button
        class="btn btn-outline-light"
        data-bs-toggle="modal"
        data-bs-target="#quizSelectModal"
      >
        Change Practice Test
      </button>
    </nav>

    <!-- Score Bar -->
    <div class="score-bar">
        <span>⏱ Time Left: <strong id="timer">--:--</strong></span>
        <span>✔ Correct: <strong id="correct-answers">0</strong></span>
        <span>✖ Incorrect: <strong id="wrong-answers">0</strong></span>
        <span>Score: <strong id="current-score">0</strong>%</span>
    </div>


    <!-- Main Content -->
    <main class="container my-4">
      <div id="quiz-meta" class="text-center mb-4">
        <h2 id="quiz-title">AWS Certified AI Practitioner</h2>
        <p id="quiz-description" class="text-muted">
          Select a practice test to begin your exam preparation
        </p>
      </div>

      <div id="quiz-container" class="quiz-container"></div>
    </main>

    <!-- Quiz Select Modal -->
    <div
      class="modal fade"
      id="quizSelectModal"
      tabindex="-1"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">
              Select AWS AI Practitioner Practice Test
            </h5>
          </div>
          <div class="modal-body d-grid gap-2">
            <button
              class="btn btn-primary"
              onclick="loadQuiz('test1.json')"
            >
              Practice Test 1
            </button>
            <button
              class="btn btn-primary"
              onclick="loadQuiz('test2.json')"
            >
              Practice Test 2
            </button>
            <button
              class="btn btn-primary"
              onclick="loadQuiz('test3.json')"
            >
              Practice Test 3
            </button>
            <button
              class="btn btn-primary"
              onclick="loadQuiz('test4.json')"
            >
              Practice Test 4
            </button>
            <button
              class="btn btn-primary"
              onclick="loadQuiz('test5.json')"
            >
              Practice Test 5
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Explanation Modal -->
    <div class="modal fade" id="explanationModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Answer Explanation</h5>
            <button class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body" id="explanation-content"></div>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>

    <!-- Auto-open modal on page load -->
    <script>
      window.addEventListener('load', () => {
        const modal = new bootstrap.Modal(
          document.getElementById('quizSelectModal')
        );
        modal.show();
      });
    </script>
  </body>
</html>
